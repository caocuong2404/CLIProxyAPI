name: Build upstream release
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild the current release and warm the build cache
        type: boolean
        default: false
permissions:
  contents: write
  packages: write
concurrency:
  group: upstream-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MIRROR_TOKEN || github.token }}
      - name: Find latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/router-for-me/CLIProxyAPI/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
      - name: Mirror upstream tag and source
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          MIRROR_ENABLED: ${{ secrets.MIRROR_TOKEN != '' }}
        run: |
          if [ "$MIRROR_ENABLED" != true ]; then
            echo '::notice::MIRROR_TOKEN is not configured; existing mirrored tags can still be released.'
            exit 0
          fi
          git remote add upstream https://github.com/router-for-me/CLIProxyAPI.git
          git fetch --no-tags upstream "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git push origin "+refs/tags/$RELEASE_TAG^{}:refs/heads/upstream-release" "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for existing image
        id: image
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/cliproxyapi"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image:$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check out release
        if: steps.image.outputs.exists != 'true' || inputs.rebuild == true
        uses: actions/checkout@v4
        with:
          repository: router-for-me/CLIProxyAPI
          ref: ${{ steps.release.outputs.tag }}
          path: upstream
          persist-credentials: false
      - name: Build and publish
        if: steps.image.outputs.exists != 'true' || inputs.rebuild == true
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          push: true
          provenance: false
          cache-from: type=gha,scope=cliproxyapi
          cache-to: type=gha,mode=max,scope=cliproxyapi
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.release.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            VERSION=${{ steps.release.outputs.tag }}
      - name: Publish mirrored release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo '::warning::Upstream tag is not mirrored. Set MIRROR_TOKEN to publish this release.'
            exit 1
          fi
          gh api "repos/router-for-me/CLIProxyAPI/releases/tags/$RELEASE_TAG" --jq '.body // ""' > "$RUNNER_TEMP/release-notes.md"
          title=$(gh api "repos/router-for-me/CLIProxyAPI/releases/tags/$RELEASE_TAG" --jq '.name // .tag_name')
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
